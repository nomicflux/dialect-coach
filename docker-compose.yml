services:
  postgres:
    image: postgres:16-alpine
    environment:
      POSTGRES_USER: dialect_coach
      POSTGRES_PASSWORD: dialect_coach_dev
      POSTGRES_DB: dialect_coach
    volumes:
      - postgres_data:/var/lib/postgresql/data
      - ./backend/sql/init.sql:/docker-entrypoint-initdb.d/init.sql
    ports:
      - "5432:5432"
    healthcheck:
      test: [ "CMD-SHELL", "pg_isready -U dialect_coach" ]
      interval: 5s
      timeout: 5s
      retries: 5

  backend:
    image: dialect-coach-backend:latest
    env_file: .env
    environment:
      DATABASE_URL: postgres://dialect_coach:dialect_coach_dev@postgres:5432/dialect_coach
      BIND_ADDRESS: 0.0.0.0:3000
    depends_on:
      postgres:
        condition: service_healthy
    ports:
      - "3000:3000"

  frontend:
    image: dialect-coach-frontend:latest
    ports:
      - "8080:80"
    depends_on:
      - backend

volumes:
  postgres_data:
