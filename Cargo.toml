[workspace]
members = [
    "shared",
    "frontend",
    "backend",
    "corpus-processor",
]
resolver = "2"

[workspace.package]
version = "0.1.0"
edition = "2024"
authors = ["Dialect Coach Contributors"]

[workspace.dependencies]
# Shared dependencies
serde = { version = "1.0", features = ["derive"] }
serde_json = "1.0"
uuid = { version = "1.0", features = ["serde", "v4"] }
chrono = { version = "0.4", features = ["serde"] }
thiserror = "2.0"
anyhow = "1.0"
