[workspace]
members = [
    "shared",
    "frontend",
    "backend",
]
exclude = ["corpus-processor"]
resolver = "2"

[profile.release]
opt-level = "z"
lto = true
strip = true
codegen-units = 1
panic = "abort"

[workspace.package]
version = "0.1.0"
edition = "2024"
authors = ["Dialect Coach Contributors"]

[workspace.dependencies]
# Shared dependencies
serde = { version = "1.0", features = ["derive"] }
serde_json = "1.0"
uuid = { version = "1.0", features = ["serde", "v4", "v5"] }
chrono = { version = "0.4", features = ["serde"] }
thiserror = "2.0"
anyhow = "1.0"
