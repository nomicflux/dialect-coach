services:
  backend:
    volumes:
      - ./config.ollama.yaml:/app/config.yaml:ro
    depends_on:
      ollama:
        condition: service_healthy

  ollama:
    image: ollama/ollama:0.40.17
    mem_limit: "${OLLAMA_MEMORY_LIMIT:-22g}"
    memswap_limit: "${OLLAMA_MEMORY_LIMIT:-22g}"
    environment:
      OLLAMA_NO_CLOUD: "1"
      OLLAMA_CONTEXT_LENGTH: "${OLLAMA_CONTEXT_LENGTH:-8192}"
      OLLAMA_FLASH_ATTENTION: "1"
      OLLAMA_MAX_LOADED_MODELS: "1"
      OLLAMA_NUM_PARALLEL: "1"
      LLAMA_ARG_CACHE_RAM: "1024"
    healthcheck:
      test: ["CMD", "ollama", "list"]
      interval: 5s
      timeout: 5s
      retries: 12
    volumes:
      - ollama_models:/root/.ollama

volumes:
  ollama_models:
