<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Dialect Coach</title>
    
    <!-- CSS Files - loaded via Trunk's data-trunk system -->
    <link data-trunk rel="css" href="styles/tokens.css">
    <link data-trunk rel="css" href="styles/base.css">
    <link data-trunk rel="css" href="styles/layout.css">
    <link data-trunk rel="css" href="styles/components/chat.css">
    <link data-trunk rel="css" href="styles/components/composer.css">
    <link data-trunk rel="css" href="styles/components/panel.css">
    <link data-trunk rel="css" href="styles/components/learning_panel.css">
    <link data-trunk rel="css" href="styles/components/branch_sidebar.css">
    <link data-trunk rel="css" href="styles/components/learning_goals.css">
    <link data-trunk rel="css" href="styles/utilities.css">
</head>
<body>
    <!-- Skip link for accessibility -->
    <a href="#main-chat" class="skip-link visually-hidden">Skip to chat</a>
    
    <div id="app">
        <div class="loading active">
            <div class="loading-spinner">🌟</div>
            <p>Loading your language coach...</p>
        </div>
    </div>

    <!-- Trunk will automatically inject the WASM bundle here -->
    <link data-trunk rel="rust" data-bin="dialect-coach-frontend" data-wasm-opt="z" />
</body>
</html>
