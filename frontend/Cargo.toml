[package]
name = "dialect-coach-frontend"
version.workspace = true
edition.workspace = true

[lib]
crate-type = ["cdylib", "rlib"]

[dependencies]
dialect-coach-shared = { path = "../shared" }
serde.workspace = true
serde_json.workspace = true
uuid.workspace = true
chrono.workspace = true

# Yew framework
yew = { version = "0.21", features = ["csr"] }
yew-router = "0.18"
gloo = "0.11"
gloo-net = "0.5"
futures-channel = "0.3"
futures-util = "0.3"

# WASM bindings
wasm-bindgen = "0.2"
wasm-bindgen-futures = "0.4"
serde-wasm-bindgen = "0.6"

# Browser APIs
web-sys = { version = "0.3", features = [
    "Window",
    "Document",
    "HtmlElement",
    "HtmlSelectElement",
    "HtmlInputElement",
    "HtmlTextAreaElement",
    "WebSocket",
    "MessageEvent",
    "Event",
    "InputEvent",
    "SubmitEvent",
    "EventTarget",
    "CloseEvent",
    "ErrorEvent",
    "SpeechSynthesis",
    "SpeechSynthesisUtterance",
    "SpeechSynthesisVoice",
    "SpeechRecognition",
    "SpeechRecognitionEvent",
    "SpeechRecognitionResult",
    "SpeechRecognitionResultList",
    "SpeechRecognitionAlternative",
] }
js-sys = "0.3"

# IndexedDB
indexed_db_futures = "0.5"

# Error handling & logging
console_error_panic_hook = "0.1"
wasm-logger = "0.2"
log = "0.4"
