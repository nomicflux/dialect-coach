[package]
name = "corpus-processor"
version = "0.1.0"
edition = "2021"

[[bin]]
name = "corpus-processor"
path = "src/main.rs"

[dependencies]
dialect-coach-shared = { path = "../shared" }
serde = { version = "1.0", features = ["derive"] }
serde_json = "1.0"
uuid = { version = "1.0", features = ["serde", "v4", "v5"] }
anyhow = "1.0"
thiserror = "2.0"
serde_yaml = "0.9"

# AI / LLM
rig-core = "0.27"
schemars = { version = "1.0", features = ["derive"] }

# CLI
clap = { version = "4.5", features = ["derive"] }
dotenvy = "0.15"

# Embeddings
fastembed = "4.2"

# Vector store
qdrant-client = "1.13"

# File I/O
csv = "1.3"
walkdir = "2.5"

# Async runtime
tokio = { version = "1.42", features = ["rt-multi-thread", "macros"] }
futures = "0.3"

# Test seams
async-trait = "0.1"
tracing-subscriber = { version = "0.3.22", features = ["env-filter", "fmt"] }

[dev-dependencies]
tempfile = "3.8"
assert_cmd = "2.0"
predicates = "3.0" 
insta = "1.34"
wiremock = "0.5"
surf-vcr = "0.2.0"
