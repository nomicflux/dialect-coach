[package]
name = "corpus-processor"
version.workspace = true
edition.workspace = true

[[bin]]
name = "corpus-processor"
path = "src/main.rs"

[dependencies]
dialect-coach-shared = { path = "../shared" }
serde.workspace = true
serde_json.workspace = true
uuid.workspace = true
anyhow.workspace = true
thiserror.workspace = true

# CLI
clap = { version = "4.5", features = ["derive"] }
dotenvy = "0.15"

# Embeddings
fastembed = "4.2"

# Vector store
qdrant-client = "1.13"

# File I/O
csv = "1.3"
walkdir = "2.5"

# Async runtime
tokio = { version = "1.42", features = ["rt-multi-thread", "macros"] }

# Test seams
async-trait = "0.1"

[dev-dependencies]
tempfile = "3.8"
assert_cmd = "2.0"
predicates = "3.0" 
insta = "1.34"
wiremock = "0.5"
surf-vcr = "0.2.0"
