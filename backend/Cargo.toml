[package]
name = "dialect-coach-backend"
version.workspace = true
edition.workspace = true

[[bin]]
name = "backend"
path = "src/main.rs"

[[bin]]
name = "admin"
path = "src/bin/admin.rs"
required-features = []

[dependencies]
dialect-coach-shared = { path = "../shared" }
serde.workspace = true
serde_json.workspace = true
serde_yaml = "0.9"
uuid.workspace = true
anyhow.workspace = true
thiserror.workspace = true
chrono.workspace = true

# Web server & WebSocket
axum = { version = "0.8", features = ["ws", "macros", "multipart"] }
tokio = { version = "1", features = ["full"] }
tower = "0.5"
tower-http = { version = "0.6", features = ["cors", "fs", "trace"] }

# AI & RAG
rig = "0.41.0"
schemars = { version = "1.0", features = ["derive"] }

# Embeddings
fastembed = "4.2"
bzip2 = "0.4"

# Vector store
qdrant-client = "1.13"

# Async utilities
futures-util = "0.3"

# HTTP client for Google TTS API and admin API
reqwest = { version = "0.12", features = ["blocking", "json"] }

# Base64 encoding for audio data
base64 = "0.22"

# async-trait for TTS provider trait
async-trait = "0.1"

# LRU cache for TTS responses
lru = "0.12"

# Random number generation for shuffling
rand = "0.8"

# Persistent storage
sled = "0.34"
sqlx = { version = "0.8", features = ["postgres", "runtime-tokio-native-tls", "json", "uuid", "migrate"] }

# Environment
dotenvy = "0.15"

# Authentication
jsonwebtoken = "9"
bcrypt = "0.15"

# Logging
tracing = "0.1"
tracing-subscriber = { version = "0.3", features = ["env-filter"] }
tonic = "0.14.2"

# Document Parsing
html2text = "0.12"
tempfile = "3"
image = "0.25"
pdfium-render = "0.8.37"

[dev-dependencies]
serial_test = "3.0"
