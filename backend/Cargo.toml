[package]
name = "dialect-coach-backend"
version.workspace = true
edition.workspace = true

[[bin]]
name = "backend"
path = "src/main.rs"

[dependencies]
dialect-coach-shared = { path = "../shared" }
serde.workspace = true
serde_json.workspace = true
uuid.workspace = true
anyhow.workspace = true
thiserror.workspace = true
chrono.workspace = true

# Web server & WebSocket
axum = { version = "0.8", features = ["ws", "macros"] }
tokio = { version = "1", features = ["full"] }
tower = "0.5"
tower-http = { version = "0.6", features = ["cors", "fs", "trace"] }

# AI & RAG
rig-core = "0.8"

# Embeddings
fastembed = "4.2"

# Vector store
qdrant-client = "1.13"

# Async utilities
futures-util = "0.3"

# HTTP client for Google TTS API
reqwest = { version = "0.12", features = ["json"] }

# Base64 encoding for audio data
base64 = "0.22"

# async-trait for TTS provider trait
async-trait = "0.1"

# LRU cache for TTS responses
lru = "0.12"

# Random number generation for shuffling
rand = "0.8"

# Persistent storage
sled = "0.34"

# Environment
dotenvy = "0.15"

# Logging
tracing = "0.1"
tracing-subscriber = { version = "0.3", features = ["env-filter"] }
